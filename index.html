<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splatoon: Battle Royale</title>
  <style>
    :root {
      --bg-color: #0d0d11;
      --card-bg: #1a1a24;
      --accent-color: #00ffcc;
      --neon-pink: #ff007f;
      --text-color: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    h1 {
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 12px var(--accent-color);
      margin: 5px 0;
      font-size: 24px;
    }

    .subtitle {
      color: var(--neon-pink);
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
      margin-bottom: 15px;
      box-sizing: border-box;
      text-align: center;
    }

    .canvas-container {
      width: 100%;
      margin: 0 auto;
    }

    canvas {
      background-color: #222;
      border: 3px solid #444;
      border-radius: 8px;
      cursor: crosshair;
      touch-action: none;
      display: block;
      width: 100%;
      height: 340px;
    }

    button {
      width: 100%;
      background: linear-gradient(45deg, var(--accent-color), #00b349);
      border: none;
      color: #000;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    button:hover { opacity: 0.9; transform: scale(1.01); }

    .btn-secondary { background: #333; color: #fff; border: 1px solid var(--accent-color); }
    .btn-danger { background: #ff4444; color: #fff; }

    .status-box {
      background: #111;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .tank-bar-container {
      width: 100%;
      background: #333;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid #555;
    }

    .tank-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00ffcc, #00b349);
      transition: width 0.1s;
    }

    #room-status { font-weight: bold; color: #ffcc00; margin-bottom: 8px; }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid var(--accent-color);
      background: #111;
      color: white;
      box-sizing: border-box;
      text-align: center;
    }

    .friend-box {
      background: #111;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px dashed var(--accent-color);
    }

    .my-color-display {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      vertical-align: middle;
      margin-left: 5px;
    }

    ol { padding-left: 20px; text-align: left; }
    li { margin-bottom: 6px; color: #ddd; }
    #loading { color: var(--accent-color); font-size: 16px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <h1>SPLAT: BATTLE ROYALE</h1>
  <div class="subtitle">〜 全員参戦！乱闘ナワバリバトロワ 〜</div>

  <div id="loading">通信中...</div>

  <!-- ログイン画面 -->
  <div id="login-section" class="card" style="display: none;">
    <h2>Googleログイン</h2>
    <p>バトロワに参加して全員でインクを塗り合おう！</p>
    <button id="btn-login">Googleでログインしてプレイ</button>
  </div>

  <!-- メインゲーム画面 -->
  <div id="game-section" class="card" style="display: none;">
    <div id="user-display"></div>

    <!-- あい言葉入力 -->
    <div class="friend-box">
      <label for="room-id-input" style="font-size: 13px; color: #ffcc00;">👑 バトロワルームの「あい言葉」:</label>
      <input type="text" id="room-id-input" placeholder="例: royale1" value="royale1">
      <button id="btn-join">バトロワ参戦！</button>
    </div>

    <div id="room-status">「あい言葉」を入力してバトロワに参戦しよう！</div>

    <div class="status-box">
      <div>あなたのインク色: <span id="my-color-indicator" class="my-color-display"></span></div>
      <div>現在の塗りポイント: <span id="my-score-val" style="color:#00ffcc; font-weight:bold;">0 pt</span></div>
    </div>

    <div style="font-size: 12px; text-align: left; margin-bottom: 2px;">INK TANK</div>
    <div class="tank-bar-container">
      <div id="tank-bar" class="tank-bar"></div>
    </div>

    <div class="canvas-container">
      <canvas id="paintCanvas" width="500" height="340"></canvas>
    </div>

    <button id="btn-clear" class="btn-secondary">ステージ清掃（リセット）</button>

    <h3>📝 プレイヤー名設定（加点要素）</h3>
    <input type="text" id="player-name-input" placeholder="イカのなまえ">
    <button id="btn-update-name" class="btn-secondary">名前を変更する</button>

    <br><br>
    <button id="btn-reset" class="btn-danger">全データを初期化</button>
    <button id="btn-logout" class="btn-secondary">ログアウト</button>
  </div>

  <!-- ランキング画面 -->
  <div id="ranking-section" class="card" style="display: none;">
    <h3>🏆 バトロワ累積塗りランキング</h3>
    <ol id="ranking-list"></ol>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithRedirect, 
      getRedirectResult, 
      signOut, 
      onAuthStateChanged,
      GoogleAuthProvider 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      deleteDoc, 
      collection, 
      getDocs, 
      query, 
      orderBy, 
      limit,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgDD5KHeP9F8KUKJNw2MoqbgqboMbnXgU",
      authDomain: "zisyu1.firebaseapp.com",
      projectId: "zisyu1",
      storageBucket: "zisyu1.firebasestorage.app",
      messagingSenderId: "977101155156",
      appId: "1:977101155156:web:edb2283bb33055090e76c1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let playerData = { name: "", totalScore: 0 };

    // バトロワカラーリスト
    const BATTLE_COLORS = [
      "#00ffcc", "#ff007f", "#ffcc00", "#9900ff", 
      "#ff6600", "#0099ff", "#76ff03", "#f44336"
    ];
    let myColor = BATTLE_COLORS[Math.floor(Math.random() * BATTLE_COLORS.length)];

    let currentRoomId = null;
    let roomUnsubscribe = null;
    let isDrawing = false;
    let myScore = 0;

    let inkAmount = 100;
    const tankBar = document.getElementById("tank-bar");

    // インク自動回復
    setInterval(() => {
      if (inkAmount < 100) {
        inkAmount = Math.min(100, inkAmount + 6);
        tankBar.style.width = `${inkAmount}%`;
      }
    }, 200);

    const loadingEl = document.getElementById("loading");
    const loginSection = document.getElementById("login-section");
    const gameSection = document.getElementById("game-section");
    const rankingSection = document.getElementById("ranking-section");
    const userDisplay = document.getElementById("user-display");
    const roomStatus = document.getElementById("room-status");
    const myScoreVal = document.getElementById("my-score-val");
    const myColorIndicator = document.getElementById("my-color-indicator");
    const btnJoin = document.getElementById("btn-join");
    const roomIdInput = document.getElementById("room-id-input");
    const nameInput = document.getElementById("player-name-input");
    const rankingList = document.getElementById("ranking-list");

    const canvas = document.getElementById("paintCanvas");
    const ctx = canvas.getContext("2d");

    getRedirectResult(auth).catch(err => console.error(err));
    document.getElementById("btn-login").addEventListener("click", () => signInWithRedirect(auth, provider));
    document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      loadingEl.style.display = "none";
      if (user) {
        currentUser = user;
        loginSection.style.display = "none";
        gameSection.style.display = "block";
        rankingSection.style.display = "block";

        await loadPlayerData(user.uid, user.displayName);
        await loadRanking();
        resetCanvas();
      } else {
        currentUser = null;
        loginSection.style.display = "block";
        gameSection.style.display = "none";
        rankingSection.style.display = "none";
      }
    });

    async function loadPlayerData(uid, defaultName) {
      try {
        const docRef = doc(db, "users", uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          playerData = docSnap.data();
        } else {
          playerData = { name: defaultName || "イカ戦士", totalScore: 0 };
          await setDoc(docRef, playerData);
        }
        updateUI();
      } catch (e) { console.error(e); }
    }

    async function savePlayerData() {
      if (!currentUser) return;
      try {
        const docRef = doc(db, "users", currentUser.uid);
        await setDoc(docRef, playerData);
        await loadRanking();
      } catch (e) { console.error(e); }
    }

    function updateUI() {
      userDisplay.innerHTML = `<p>プレイヤー: <strong>${playerData.name}</strong></p>`;
      myColorIndicator.style.backgroundColor = myColor;
      nameInput.value = playerData.name;
    }

    function resetCanvas() {
      ctx.fillStyle = "#222222";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      myScore = 0;
      myScoreVal.textContent = "0 pt";
    }

    // バトロワルーム参戦
    btnJoin.addEventListener("click", () => {
      const roomId = roomIdInput.value.trim();
      if (!roomId) {
        alert("あい言葉を入力してください！");
        return;
      }

      currentRoomId = roomId;
      resetCanvas();
      roomStatus.textContent = `🔥 バトロワルーム [${roomId}] にリアルタイム接続中！`;

      // 自分のインク色をランダム決定
      myColor = BATTLE_COLORS[Math.floor(Math.random() * BATTLE_COLORS.length)];
      myColorIndicator.style.backgroundColor = myColor;

      const roomRef = doc(
