<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splatoon: Friend Online Battle</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --p1-color: #00ff66;
      --p2-color: #ff0055;
      --text-color: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    h1 {
      color: var(--p1-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--p1-color);
      margin: 5px 0;
      font-size: 24px;
    }

    .subtitle {
      color: var(--p2-color);
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--p1-color);
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
      margin-bottom: 15px;
      box-sizing: border-box;
      text-align: center;
    }

    .canvas-container {
      width: 100%;
      margin: 0 auto;
    }

    canvas {
      background-color: #222;
      border: 3px solid #444;
      border-radius: 8px;
      cursor: crosshair;
      touch-action: none;
      display: block;
      width: 100%;
      height: 320px;
    }

    button {
      width: 100%;
      background: linear-gradient(45deg, var(--p1-color), #00b349);
      border: none;
      color: #000;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    button:hover { opacity: 0.9; transform: scale(1.01); }
    button:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }

    .btn-secondary { background: #333; color: #fff; border: 1px solid var(--p1-color); }
    .btn-danger { background: #ff4444; color: #fff; }

    .status-box {
      display: flex;
      justify-content: space-around;
      background: #111;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .status-item { text-align: center; }
    .status-value { font-size: 18px; font-weight: bold; }
    .p1-text { color: var(--p1-color); }
    .p2-text { color: var(--p2-color); }

    .tank-bar-container {
      width: 100%;
      background: #333;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid #555;
    }

    .tank-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00ff66, #00b349);
      transition: width 0.1s;
    }

    #room-status { font-weight: bold; color: #ffcc00; margin-bottom: 8px; }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid var(--p1-color);
      background: #111;
      color: white;
      box-sizing: border-box;
      text-align: center;
    }

    .friend-box {
      background: #111;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px dashed var(--p1-color);
    }

    ol { padding-left: 20px; text-align: left; }
    li { margin-bottom: 6px; color: #ddd; }
    #loading { color: var(--p1-color); font-size: 16px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <h1>SPLAT-TURF: FRIEND MATCH</h1>
  <div class="subtitle">〜 友達と合言葉でリアルタイム対戦 〜</div>

  <div id="loading">通信中...</div>

  <!-- ログイン画面 -->
  <div id="login-section" class="card" style="display: none;">
    <h2>Googleログイン</h2>
    <p>Googleアカウントでログインして友達と対戦しよう！</p>
    <button id="btn-login">Googleでログインしてプレイ</button>
  </div>

  <!-- メインゲーム画面 -->
  <div id="game-section" class="card" style="display: none;">
    <div id="user-display"></div>

    <!-- 友達対戦用 あい言葉入力 -->
    <div class="friend-box">
      <label for="room-id-input" style="font-size: 13px; color: #ffcc00;">🔑 友達と同じ「あい言葉」を入力:</label>
      <input type="text" id="room-id-input" placeholder="例: 1234" value="1234">
      <button id="btn-join">この「あい言葉」で部屋に入る</button>
    </div>

    <div id="room-status">「あい言葉」を入力して部屋に入ってください</div>

    <div class="status-box">
      <div class="status-item">
        <div id="p1-label" class="p1-text">P1 (緑)</div>
        <div id="p1-score" class="status-value p1-text">0 pt</div>
      </div>
      <div class="status-item">
        <div id="p2-label" class="p2-text">P2 (赤)</div>
        <div id="p2-score" class="status-value p2-text">0 pt</div>
      </div>
      <div class="status-item">
        <div>勝利数</div>
        <div id="wins-val" class="status-value" style="color: #00ffcc;">0 勝利</div>
      </div>
    </div>

    <div style="font-size: 12px; text-align: left; margin-bottom: 2px;">INK TANK</div>
    <div class="tank-bar-container">
      <div id="tank-bar" class="tank-bar"></div>
    </div>

    <div class="canvas-container">
      <canvas id="paintCanvas" width="500" height="320"></canvas>
    </div>

    <h3>📝 プレイヤー名設定（加点要素）</h3>
    <input type="text" id="player-name-input" placeholder="イカのなまえ">
    <button id="btn-update-name" class="btn-secondary">名前を変更する</button>

    <br><br>
    <button id="btn-reset" class="btn-danger">全データを初期化</button>
    <button id="btn-logout" class="btn-secondary">ログアウト</button>
  </div>

  <!-- ランキング画面 -->
  <div id="ranking-section" class="card" style="display: none;">
    <h3>🏆 オンライン対戦 勝利数ランキング</h3>
    <ol id="ranking-list"></ol>
  </div>
