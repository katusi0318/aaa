<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>eFOOTBALL REAL TIME 3D 2P</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js CDN for 3D Graphics -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: radial-gradient(circle at center, #0b0f19 0%, #030508 100%);
      color: #ffffff;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .font-teko {
      font-family: 'Teko', sans-serif;
    }

    /* Glassmorphism Styling */
    .glass-card {
      background: rgba(18, 25, 41, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 242, 254, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
    }

    .glass-btn {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.3));
      border: 1px solid rgba(0, 242, 254, 0.5);
      transition: all 0.2s ease-in-out;
    }
    .glass-btn:active {
      transform: scale(0.95);
      background: rgba(0, 242, 254, 0.5);
    }

    /* Neon Glow Effects */
    .neon-text-blue {
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.8), 0 0 20px rgba(0, 242, 254, 0.4);
    }
    .neon-text-pink {
      text-shadow: 0 0 10px rgba(255, 0, 128, 0.8), 0 0 20px rgba(255, 0, 128, 0.4);
    }

    /* Custom D-Pad Touch Interface */
    .dpad-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      user-select: none;
      -webkit-user-select: none;
    }
    .dpad-btn:active, .dpad-btn.active {
      background: rgba(0, 242, 254, 0.4);
      border-color: #00f2fe;
    }

    /* Canvas Viewport */
    #canvas-container {
      position: relative;
      width: 100%;
      height: 380px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(0, 242, 254, 0.3);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.15);
    }

    /* Scoreboard Overlay */
    .hud-overlay {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 420px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4">

  <!-- Header Header Header -->
  <header class="w-full max-w-2xl text-center my-2">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wider font-teko uppercase text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-pink-500">
      <i class="fa-solid font-bold fa-futbol mr-2 text-cyan-400"></i>eFOOTBALL REAL 3D ONLINE
    </h1>
    <p class="text-xs text-gray-400 tracking-wider">スタジアム体感型 1vs1 リアルタイム通信サッカーゲーム</p>
  </header>

  <!-- Global Loading Indicator -->
  <div id="loading" class="text-cyan-400 font-bold my-8 flex items-center space-x-2">
    <i class="fa-solid fa-circle-notch fa-spin text-2xl"></i>
    <span>スタジアム読み込み中...</span>
  </div>

  <!-- 1. LOGIN SECTION -->
  <div id="login-section" class="glass-card rounded-2xl p-6 w-full max-w-md text-center my-auto" style="display: none;">
    <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gradient-to-tr from-cyan-500 to-pink-500 flex items-center justify-center shadow-lg shadow-cyan-500/30">
      <i class="fa-solid fa-trophy text-3xl text-white"></i>
    </div>
    <h2 class="text-xl font-bold mb-2">オンラインキックオフ</h2>
    <p class="text-xs text-gray-400 mb-6 leading-relaxed">
      Googleアカウントでサインインして、友達と同じあい言葉（ルーム名）でリアルタイムマッチに参戦しよう！
    </p>
    <button id="btn-login" class="w-full py-3.5 px-4 rounded-xl text-black font-bold bg-gradient-to-r from-cyan-400 to-blue-500 hover:opacity-90 shadow-lg shadow-cyan-500/30 flex items-center justify-center space-x-2 text-sm tracking-wider">
      <i class="fa-brands fa-google text-lg"></i>
      <span>Google アカウントでログイン</span>
    </button>
  </div>

  <!-- 2. MAIN GAME SECTION -->
  <div id="game-section" class="w-full max-w-2xl space-y-3" style="display: none;">
    
    <!-- User Info & Room Settings -->
    <div class="glass-card p-3 sm:p-4 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-3">
      <div id="user-display" class="text-xs sm:text-sm text-gray-300 flex items-center space-x-2">
        <i class="fa-solid fa-user-gear text-cyan-400"></i>
        <span>読み込み中...</span>
      </div>

      <!-- Room Joining Controls -->
      <div class="flex items-center space-x-2 w-full sm:w-auto">
        <input type="text" id="room-id-input" value="1234" placeholder="あい言葉 (例: 1234)" 
          class="bg-slate-900 border border-cyan-500/40 rounded-lg px-3 py-1.5 text-xs text-white text-center w-full sm:w-32 focus:outline-none focus:border-cyan-400">
        <button id="btn-join" class="glass-btn px-4 py-1.5 rounded-lg text-xs font-bold text-cyan-300 whitespace-nowrap hover:bg-cyan-500/20">
          <i class="fa-solid fa-right-to-bracket mr-1"></i>入室
        </button>
      </div>
    </div>

    <!-- Match Status Banner -->
    <div id="status-msg" class="text-center text-xs font-bold text-yellow-400 bg-black/40 py-1.5 px-3 rounded-lg border border-yellow-500/20 shadow-inner">
      あい言葉を入力して「入室」を押してください
    </div>

    <!-- 3D VIEWPORT & HUD -->
    <div id="canvas-container">
      
      <!-- Realistic HUD Scoreboard -->
      <div class="hud-overlay glass-card rounded-xl p-2 px-4 flex justify-between items-center text-center">
        <!-- P1 / HOME -->
        <div class="flex items-center space-x-2">
          <div class="w-3 h-3 rounded-full bg-cyan-400 shadow-md shadow-cyan-400"></div>
          <div class="text-left">
            <div id="p1-name" class="text-xs font-bold text-cyan-300 truncate max-w-[80px]">P1 (HOME)</div>
            <div id="p1-score" class="font-teko text-2xl font-bold leading-none neon-text-blue">0</div>
          </div>
        </div>

        <div class="font-teko text-xl font-bold text-gray-400 px-2">VS</div>

        <!-- P2 / AWAY -->
        <div class="flex items-center space-x-2">
          <div class="text-right">
            <div id="p2-name" class="text-xs font-bold text-pink-400 truncate max-w-[80px]">P2 (AWAY)</div>
            <div id="p2-score" class="font-teko text-2xl font-bold leading-none neon-text-pink">0</div>
          </div>
          <div class="w-3 h-3 rounded-full bg-pink-500 shadow-md shadow-pink-500"></div>
        </div>
      </div>

      <!-- Canvas Render Location -->
      <div id="three-canvas" class="w-full h-full"></div>
    </div>

    <!-- CONTROLS & ACTION BUTTONS -->
    <div class="grid grid-cols-12 gap-3 items-center glass-card p-3 rounded-2xl">
      <!-- D-Pad Directional Keys -->
      <div class="col-span-6 sm:col-span-5 grid grid-cols-3 gap-1.5 w-36 h-36 mx-auto sm:mx-0">
        <div></div>
        <div id="btn-up" class="dpad-btn"><i class="fa-solid fa-chevron-up"></i></div>
        <div></div>
        <div id="btn-left" class="dpad-btn"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="dpad-btn opacity-30"><i class="fa-solid fa-gamepad text-xs"></i></div>
        <div id="btn-right" class="dpad-btn"><i class="fa-solid fa-chevron-right"></i></div>
        <div></div>
        <div id="btn-down" class="dpad-btn"><i class="fa-solid fa-chevron-down"></i></div>
        <div></div>
      </div>

      <!-- Action & Skill Buttons -->
      <div class="col-span-6 sm:col-span-7 flex flex-col justify-center space-y-2">
        <button id="btn-kick" class="w-full py-3 rounded-xl font-bold text-white text-sm bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 hover:opacity-90 shadow-lg shadow-pink-500/30 active:scale-95 transition-all">
          <i class="fa-solid fa-bolt mr-1"></i> シュート / パス [SPACE]
        </button>
        <button id="btn-reset-ball" class="w-full py-2 rounded-xl text-xs font-medium bg-slate-800 border border-slate-700 text-gray-300 hover:bg-slate-700 active:scale-95 transition-all">
          <i class="fa-solid fa-rotate-left mr-1"></i> ボールリセット
        </button>
      </div>
    </div>

    <!-- PLAYER PROFILE SETTINGS -->
    <div class="glass-card p-3.5 rounded-xl space-y-2">
      <div class="text-xs text-cyan-300 font-bold flex items-center space-x-1">
        <i class="fa-solid fa-pen-to-square"></i>
        <span>プレイヤーネーム編集 (クラウド同期)</span>
      </div>
      <div class="flex space-x-2">
        <input type="text" id="player-name-input" placeholder="例: ストライカーFC" 
          class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white flex-1 focus:outline-none focus:border-cyan-400">
        <button id="btn-update-name" class="glass-btn px-4 py-1.5 rounded-lg text-xs text-cyan-300 font-bold">更新</button>
      </div>
    </div>

    <!-- DATA MANAGEMENT & LOGOUT -->
    <div class="flex space-x-2 pt-1">
      <button id="btn-reset-data" class="flex-1 py-2 rounded-xl text-xs bg-red-950/60 border border-red-500/30 text-red-400 font-semibold hover:bg-red-900/50">
        <i class="fa-solid fa-trash-can mr-1"></i> データ初期化
      </button>
      <button id="btn-logout" class="flex-1 py-2 rounded-xl text-xs bg-slate-800 border border-slate-700 text-gray-400 font-semibold hover:bg-slate-700">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> ログアウト
      </button>
    </div>
  </div>

  <!-- 3. ONLINE RANKING LEADERBOARD -->
  <div id="ranking-section" class="w-full max-w-2xl glass-card p-4 rounded-xl my-3" style="display: none;">
    <h3 class="text-sm font-bold text-cyan-300 flex items-center space-x-2 mb-2">
      <i class="fa-solid fa-ranking-star text-yellow-400 text-base"></i>
      <span>通算勝利数 グローバルランキング</span>
    </h3>
    <ol id="ranking-list" class="space-y-1.5 text-xs text-gray-300"></ol>
  </div>

  <!-- Footer Footer Footer -->
  <footer class="text-center text-[10px] text-gray-500 py-2">
    eFootball Online 3D Engine &bull; Powered by Three.js & Firebase
  </footer>

  <!-- FIREBASE SDKs (v10.8.0) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithRedirect, 
      getRedirectResult, 
      signOut, 
      onAuthStateChanged,
      GoogleAuthProvider 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      deleteDoc, 
      collection, 
      getDocs, 
      query, 
      orderBy, 
      limit,
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyCgDD5KHeP9F8KUKJNw2MoqbgqboMbnXgU",
      authDomain: "zisyu1.firebaseapp.com",
      projectId: "zisyu1",
      storageBucket: "zisyu1.firebasestorage.app",
      messagingSenderId: "977101155156",
      appId: "1:977101155156:web:edb2283bb33055090e76c1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let playerData = { name: "ストライカーFC", wins: 0 };
    let myRole = null; // "p1" or "p2"
    let currentRoomId = null;
    let roomUnsubscribe = null;

    // Game Physics & Coordinates State
    const PITCH_WIDTH = 50;
    const PITCH_HEIGHT = 30;

    const gameState = {
      p1: { x: -18, z: 0 },
      p2: { x: 18, z: 0 },
      ball: { x: 0, y: 0.6, z: 0, vx: 0, vz: 0 },
      score1: 0,
      score2: 0
    };

    // UI Elements
    const loadingEl = document.getElementById("loading");
    const loginSection = document.getElementById("login-section");
    const gameSection = document.getElementById("game-section");
    const rankingSection = document.getElementById("ranking-section");
    const userDisplay = document.getElementById("user-display");
    const statusMsg = document.getElementById("status-msg");
    const p1NameEl = document.getElementById("p1-name");
    const p2NameEl = document.getElementById("p2-name");
    const p1ScoreEl = document.getElementById("p1-score");
    const p2ScoreEl = document.getElementById("p2-score");
    const roomIdInput = document.getElementById("room-id-input");
    const nameInput = document.getElementById("player-name-input");
    const rankingList = document.getElementById("ranking-list");

    // Web Audio Sound Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playKickSound() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e){}
    }

    // Three.js 3D Engine Variables
    let scene, camera, renderer;
    let p1Mesh, p2Mesh, ballMesh;

    function init3D() {
      const container = document.getElementById('three-canvas');
      const width = container.clientWidth;
      const height = container.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060911);
      scene.fog = new THREE.FogExp2(0x060911, 0.015);

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 32, 28);
      camera.lookAt(0, 0, 2);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const stadiumLight1 = new THREE.SpotLight(0x00f2fe, 1.2);
      stadiumLight1.position.set(-25, 30, -15);
      stadiumLight1.castShadow = true;
      scene.add(stadiumLight1);

      const stadiumLight2 = new THREE.SpotLight(0xff0080, 1.2);
      stadiumLight2.position.set(25, 30, 15);
      stadiumLight2.castShadow = true;
      scene.add(stadiumLight2);

      // Soccer Field Grass
      const pitchGeo = new THREE.PlaneGeometry(PITCH_WIDTH, PITCH_HEIGHT);
      const pitchMat = new THREE.MeshStandardMaterial({ color: 0x184a28, roughness: 0.6 });
      const pitch = new THREE.Mesh(pitchGeo, pitchMat);
      pitch.rotation.x = -Math.PI / 2;
      pitch.receiveShadow = true;
      scene.add(pitch);

      // Field Boundary Lines
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
      
      // Center Line
      const centerGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0.02, -PITCH_HEIGHT / 2),
        new THREE.Vector3(0, 0.02, PITCH_HEIGHT / 2)
      ]);
      scene.add(new THREE.Line(centerGeo, lineMat));

      // Goals
      createGoal(-PITCH_WIDTH / 2, 0x00f2fe);
      createGoal(PITCH_WIDTH / 2, 0xff0080);

      // --- リアルな3Dプレイヤーモデル作成関数 ---
      function createPlayerModel(mainColorHex, accentColorHex) {
        const group = new THREE.Group();

        // 胴体 (ユニフォーム)
        const torsoGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.2, 16);
        const torsoMat = new THREE.MeshStandardMaterial({ color: mainColorHex, roughness: 0.3, metalness: 0.1 });
        const torso = new THREE.Mesh(torsoGeo, torsoMat);
        torso.position.y = 1.1;
        torso.castShadow = true;
        group.add(torso);

        // 頭部 (肌色 + 髪型)
        const headGeo = new THREE.SphereGeometry(0.32, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.8 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.95;
        head.castShadow = true;
        group.add(head);

        // 髪の毛
        const hairGeo = new THREE.SphereGeometry(0.34, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        const hair = new THREE.Mesh(hairGeo, hairMat);
        hair.position.y = 1.98;
        group.add(hair);

        // 足 (パンツ + スパイク)
        const legGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.7, 12);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
        
        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.set(-0.22, 0.35, 0);
        leftLeg.castShadow = true;
        group.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, legMat);
        rightLeg.position.set(0.22, 0.35, 0);
        rightLeg.castShadow = true;
        group.add(rightLeg);

        // 足元のライティングリング（視認性向上）
        const ringGeo = new THREE.RingGeometry(0.6, 0.75, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: mainColorHex, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.02;
        group.add(ring);

        return group;
      }

      // P1 Player (Cyan/Blue Unit)
      p1Mesh = createPlayerModel(0x00f2fe, 0x0088ff);
      scene.add(p1Mesh);

      // P2 Player (Pink/Red Unit)
      p2Mesh = createPlayerModel(0xff0080, 0xff0040);
      scene.add(p2Mesh);

      // Ball (Soccer Sphere with detailed texture pattern)
      const ballGeo = new THREE.SphereGeometry(0.5, 32, 32);
      const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 });
      ballMesh = new THREE.Mesh(ballGeo, ballMat);
      ballMesh.position.y = 0.5;
      ballMesh.castShadow = true;
      scene.add(ballMesh);

      window.addEventListener('resize', onWindowResize);
      animate3D();
    }

    function createGoal(xPos, colorHex) {
      const goalGroup = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.3 });
      
      const postGeo = new THREE.CylinderGeometry(0.15, 0.15, 4);
      const leftPost = new THREE.Mesh(postGeo, mat);
      leftPost.position.set(xPos, 2, -4);
      
      const rightPost = new THREE.Mesh(postGeo, mat);
      rightPost.position.set(xPos, 2, 4);

      const crossGeo = new THREE.CylinderGeometry(0.15, 0.15, 8);
      const crossbar = new THREE.Mesh(crossGeo, mat);
      crossbar.rotation.x = Math.PI / 2;
      crossbar.position.set(xPos, 4, 0);

      goalGroup.add(leftPost, rightPost, crossbar);
      scene.add(goalGroup);
    }

    function onWindowResize() {
      const container = document.getElementById('three-canvas');
      if (!container) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate3D() {
      requestAnimationFrame(animate3D);

      // Smooth Interpolation for Mesh Positions
      p1Mesh.position.x += (gameState.p1.x - p1Mesh.position.x) * 0.3;
      p1Mesh.position.z += (gameState.p1.z - p1Mesh.position.z) * 0.3;

      p2Mesh.position.x += (gameState.p2.x - p2Mesh.position.x) * 0.3;
      p2Mesh.position.z += (gameState.p2.z - p2Mesh.position.z) * 0.3;

      ballMesh.position.x += (gameState.ball.x - ballMesh.position.x) * 0.3;
      ballMesh.position.z += (gameState.ball.z - ballMesh.position.z) * 0.3;
      ballMesh.position.y = gameState.ball.y;

      // Ball Rotation Simulation
      ballMesh.rotation.x += 0.05;
      ballMesh.rotation.z += 0.05;

      renderer.render(scene, camera);
    }

    // AUTHENTICATION MANAGEMENT
    // ポップアップと匿名ログイン対応を追加してログイン失敗を防ぐ
    import { signInWithPopup, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    document.getElementById("btn-login").addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.warn("Popup blocked or failed, trying redirect...", err);
        try {
          await signInWithRedirect(auth, provider);
        } catch (e) {
          console.error("Redirect login failed, falling back to anonymous session:", e);
          await signInAnonymously(auth);
        }
      }
    });

    document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      loadingEl.style.display = "none";
      if (user) {
        currentUser = user;
        loginSection.style.display = "none";
        gameSection.style.display = "block";
        rankingSection.style.display = "block";

        const displayName = user.displayName || (user.isAnonymous ? "ゲストプレイヤー" : "ストライカーFC");
        await loadPlayerData(user.uid, displayName);
        await loadRanking();
        
        if (!renderer) {
          setTimeout(init3D, 100);
        }
      } else {
        currentUser = null;
        loginSection.style.display = "block";
        gameSection.style.display = "none";
        rankingSection.style.display = "none";
      }
    });

    async function loadPlayerData(uid, defaultName) {
      try {
        const docRef = doc(db, "users", uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          playerData = docSnap.data();
        } else {
          playerData = { name: defaultName || "ストライカーFC", wins: 0 };
          await setDoc(docRef, playerData);
        }
        userDisplay.innerHTML = `<i class="fa-solid fa-circle-user text-cyan-400 text-base"></i><span><strong>${playerData.name}</strong> (${playerData.wins || 0} 勝)</span>`;
        nameInput.value = playerData.name;
      } catch (e) { console.error("データ読込エラー:", e); }
    }

    async function savePlayerData() {
      if (!currentUser) return;
      try {
        const docRef = doc(db, "users", currentUser.uid);
        await setDoc(docRef, playerData);
        userDisplay.innerHTML = `<i class="fa-solid fa-circle-user text-cyan-400 text-base"></i><span><strong>${playerData.name}</strong> (${playerData.wins || 0} 勝)</span>`;
        await loadRanking();
      } catch (e) { console.error("データ保存エラー:", e); }
    }

    // ROOM JOIN & REALTIME SYNC
    document.getElementById("btn-join").addEventListener("click", async () => {
      const roomId = roomIdInput.value.trim();
      if (!roomId) return alert("あい言葉を入力してください！");

      currentRoomId = roomId;
      statusMsg.textContent = `部屋 [${roomId}] に通信接続中...`;

      const roomRef = doc(db, "rooms", `efootball_${roomId}`);
      const roomSnap = await getDoc(roomRef);

      if (!roomSnap.exists() || !roomSnap.data().p1) {
        myRole = "p1";
        await setDoc(roomRef, {
          p1: playerData.name,
          p2: null,
          p1Pos: { x: -18, z: 0 },
          p2Pos: { x: 18, z: 0 },
          ball: { x: 0, y: 0.6, z: 0 },
          s1: 0, s2: 0
        });
        statusMsg.textContent = `部屋 [${roomId}] (P1: HOME) で待機中... 友達(P2)の参加を待っています`;
      } else if (!roomSnap.data().p2 && roomSnap.data().p1 !== playerData.name) {
        myRole = "p2";
        await setDoc(roomRef, { p2: playerData.name }, { merge: true });
        statusMsg.textContent = `部屋 [${roomId}] (P2: AWAY) に参戦！ キックオフ！`;
      } else {
        myRole = "p1";
        await setDoc(roomRef, {
          p1: playerData.name,
          p2: null,
          p1Pos: { x: -18, z: 0 },
          p2Pos: { x: 18, z: 0 },
          ball: { x: 0, y: 0.6, z: 0 },
          s1: 0, s2: 0
        });
        statusMsg.textContent = `部屋 [${roomId}] を初期化しました。対戦相手を待ちます`;
      }

      listenRoom(roomRef);
    });

    function listenRoom(roomRef) {
      if (roomUnsubscribe) roomUnsubscribe();

      roomUnsubscribe = onSnapshot(roomRef, (snapshot) => {
        const data = snapshot.data();
        if (!data) return;

        if (data.p1) p1NameEl.textContent = data.p1;
        if (data.p2) p2NameEl.textContent = data.p2;

        if (data.p1 && data.p2) {
          statusMsg.textContent = `⚡ MATCH: [${data.p1}] VS [${data.p2}]`;
        }

        if (data.p1Pos) gameState.p1 = data.p1Pos;
        if (data.p2Pos) gameState.p2 = data.p2Pos;
        if (data.ball) gameState.ball = data.ball;

        if (data.s1 !== undefined) {
          gameState.score1 = data.s1;
          p1ScoreEl.textContent = data.s1;
        }
        if (data.s2 !== undefined) {
          gameState.score2 = data.s2;
          p2ScoreEl.textContent = data.s2;
        }
      });
    }

    // MOVEMENT & ACTIONS
    async function movePlayer(dx, dz) {
      if (!myRole || !currentRoomId) return;

      const myPos = (myRole === "p1") ? gameState.p1 : gameState.p2;
      myPos.x = Math.max(-PITCH_WIDTH / 2 + 1, Math.min(PITCH_WIDTH / 2 - 1, myPos.x + dx));
      myPos.z = Math.max(-PITCH_HEIGHT / 2 + 1, Math.min(PITCH_HEIGHT / 2 - 1, myPos.z + dz));

      const roomRef = doc(db, "rooms", `efootball_${currentRoomId}`);
      const key = (myRole === "p1") ? "p1Pos" : "p2Pos";

      await setDoc(roomRef, { [key]: myPos }, { merge: true });
    }

    async function kickBall() {
      if (!myRole || !currentRoomId) return;

      playKickSound();
      const myPos = (myRole === "p1") ? gameState.p1 : gameState.p2;
      const dist = Math.hypot(gameState.ball.x - myPos.x, gameState.ball.z - myPos.z);

      if (dist < 3.5) {
        const dir = (myRole === "p1") ? 1 : -1;
        gameState.ball.x += dir * 6;
        gameState.ball.z += (Math.random() - 0.5) * 3;
        gameState.ball.y = 1.2;

        // Goal Check
        if (gameState.ball.x > PITCH_WIDTH / 2 - 1 && Math.abs(gameState.ball.z) < 4) {
          gameState.score1 += 1;
          gameState.ball = { x: 0, y: 0.6, z: 0 };
          if (myRole === "p1") {
            playerData.wins = (playerData.wins || 0) + 1;
            await savePlayerData();
          }
        } else if (gameState.ball.x < -PITCH_WIDTH / 2 + 1 && Math.abs(gameState.ball.z) < 4) {
          gameState.score2 += 1;
          gameState.ball = { x: 0, y: 0.6, z: 0 };
          if (myRole === "p2") {
            playerData.wins = (playerData.wins || 0) + 1;
            await savePlayerData();
          }
        }

        gameState.ball.x = Math.max(-PITCH_WIDTH / 2 + 1, Math.min(PITCH_WIDTH / 2 - 1, gameState.ball.x));
        gameState.ball.z = Math.max(-PITCH_HEIGHT / 2 + 1, Math.min(PITCH_HEIGHT / 2 - 1, gameState.ball.z));

        const roomRef = doc(db, "rooms", `efootball_${currentRoomId}`);
        await setDoc(roomRef, {
          ball: gameState.ball,
          s1: gameState.score1,
          s2: gameState.score2
        }, { merge: true });
      }
    }

    // Keyboard & D-Pad Bindings
    window.addEventListener("keydown", (e) => {
      const step = 1.2;
      if (e.key === "ArrowUp" || e.key === "w") movePlayer(0, -step);
      if (e.key === "ArrowDown" || e.key === "s") movePlayer(0, step);
      if (e.key === "ArrowLeft" || e.key === "a") movePlayer(-step, 0);
      if (e.key === "ArrowRight" || e.key === "d") movePlayer(step, 0);
      if (e.key === " ") kickBall();
    });

    document.getElementById("btn-up").addEventListener("click", () => movePlayer(0, -1.5));
    document.getElementById("btn-down").addEventListener("click", () => movePlayer(0, 1.5));
    document.getElementById("btn-left").addEventListener("click", () => movePlayer(-1.5, 0));
    document.getElementById("btn-right").addEventListener("click", () => movePlayer(1.5, 0));
    document.getElementById("btn-kick").addEventListener("click", kickBall);

    document.getElementById("btn-reset-ball").addEventListener("click", async () => {
      if (!currentRoomId) return;
      gameState.ball = { x: 0, y: 0.6, z: 0 };
      const roomRef = doc(db, "rooms", `efootball_${currentRoomId}`);
      await setDoc(roomRef, { ball: gameState.ball }, { merge: true });
    });

    document.getElementById("btn-update-name").addEventListener("click", async () => {
      const newName = nameInput.value.trim();
      if (newName) {
        playerData.name = newName;
        await savePlayerData();
        alert("チームネームを更新しました！");
      }
    });

    document.getElementById("btn-reset-data").addEventListener("click", async () => {
      if (confirm("本当にプレイヤーデータを初期化しますか？")) {
        const docRef = doc(db, "users", currentUser.uid);
        await deleteDoc(docRef);
        playerData = { name: currentUser.displayName || "ストライカー選手", wins: 0 };
        await savePlayerData();
        alert("データを初期化しました。");
      }
    });

    // LEADERBOARD RANKING
    async function loadRanking() {
      rankingList.innerHTML = "";
      try {
        const q = query(collection(db, "users"), orderBy("wins", "desc"), limit(5));
        const querySnapshot = await getDocs(q);

        let rank = 1;
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const li = document.createElement("li");
          li.className = "flex justify-between items-center bg-slate-900/80 p-2 rounded-lg border border-slate-800";
          li.innerHTML = `
            <span class="font-bold flex items-center space-x-2">
              <span class="w-5 h-5 rounded-full ${rank === 1 ? 'bg-yellow-500 text-black' : 'bg-slate-800 text-gray-400'} flex items-center justify-center text-[10px]">${rank}</span>
              <span>${data.name || "名無しの選手"}</span>
            </span>
            <span class="font-teko text-base font-bold text-cyan-400">${data.wins || 0} 勝</span>
          `;
          rankingList.appendChild(li);
          rank++;
        });
      } catch (e) { console.error("ランキング取得エラー:", e); }
    }
  </script>
</body>
</html>
